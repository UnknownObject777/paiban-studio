<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>排版工作台 paiban-studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-phase="landing">
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand"><span class="seal">排</span>排版工作台<span class="brand-tag">PAIBAN STUDIO</span></div>
    <div class="safety-hint" title="所有修改只作用于工作副本，原始文件不会被改动">只处理副本 · 原稿不动 · 全程本地</div>
    <div class="spacer"></div>
    <div id="model-status" class="model-status pill">模型检测中…</div>
    <button id="btn-settings" class="btn pill ghost">模型设置</button>
  </header>

  <!-- Landing：唯一居中对话窗（类 ChatGPT 首屏） -->
  <main id="landing">
    <div class="landing-inner">
      <p class="eyebrow">AI TYPESETTING ENGINE</p>
      <h1 class="landing-title">用自然语言<br>指挥 AI 排版</h1>
      <p class="dim">打开一篇排版混乱的 docx，然后直接说你想怎么排</p>
      <div id="landing-input-slot" class="input-slot">
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="打开文档后，对 AI 说你想怎么排…" autocomplete="off">
          <button type="submit" class="btn pill solid" id="btn-send">发送</button>
          <button type="button" class="btn pill ghost hidden" id="btn-abort">停止</button>
        </form>
      </div>
      <div class="suggest-chips">
        <button type="button" class="suggest-chip" data-prompt="标题改成黑体三号居中">「标题改成黑体三号居中」</button>
        <button type="button" class="suggest-chip" data-prompt="正文统一仿宋四号，行距 28 磅">「正文统一仿宋四号、行距 28 磅」</button>
        <button type="button" class="suggest-chip" data-prompt="按《通知》模板的样式排">「按《通知》模板的样式排」</button>
      </div>
      <div class="landing-actions">
        <button id="btn-open-doc-landing" class="btn pill solid big-action">打开 docx 开始</button>
      </div>
      <div id="landing-recents" class="landing-recents"></div>
      <p class="dim small-note">所有修改只作用于工作副本，原始文件不会被改动</p>
    </div>
  </main>

  <!-- 编辑态：对话左移窄列 + 右侧大预览 -->
  <div id="workbench" class="hidden">
    <!-- 窄屏视图切换（宽屏隐藏） -->
    <div class="view-tabs">
      <button type="button" class="view-tab active" data-tab="chat">对话</button>
      <button type="button" class="view-tab" data-tab="preview">预览</button>
    </div>

    <aside id="chat-col">
      <div class="chat-head">
        <button id="btn-back" class="btn pill small ghost" title="返回首页">← 首页</button>
        <span id="current-doc-name" class="doc-name" title=""></span>
        <div class="chat-head-actions">
          <button id="btn-drawer-docs" class="btn pill small">文档</button>
          <button id="btn-drawer-templates" class="btn pill small">模板</button>
          <button id="btn-drawer-versions" class="btn pill small">版本</button>
        </div>
      </div>

      <!-- 用户可感知的工作进度：当前步骤 + 步骤链 -->
      <div id="progress-bar" class="hidden">
        <div class="progress-current">
          <span class="progress-spinner" aria-hidden="true"></span>
          <span id="progress-label"></span>
        </div>
        <ol id="progress-steps"></ol>
      </div>

      <div id="chat-stream" class="chat-stream"></div>
      <div id="editing-input-slot" class="input-slot"></div>
    </aside>

    <main id="preview-col">
      <div class="preview-head">
        <h2>实时预览</h2>
        <button id="btn-download" class="btn pill small" disabled>下载 docx</button>
      </div>
      <div id="preview-wrap">
        <div id="preview-placeholder" class="dim">打开文档后此处实时渲染排版效果</div>
        <iframe id="preview-frame" src="preview.html?x2t-only" title="文档预览" class="hidden"></iframe><!-- TEMP: x2t 隔离测试，定位 OOM 后还原 -->
      </div>
    </main>
  </div>
</div>

<!-- 抽屉：工作文档 -->
<dialog id="drawer-docs" class="drawer">
  <div class="drawer-head">
    <h3>工作文档</h3>
    <button class="btn pill small ghost" data-close>关闭</button>
  </div>
  <button id="btn-open-doc" class="btn pill solid">打开 docx</button>
  <ul id="doc-list" class="item-list empty-hint" data-empty="打开一篇排版混乱的 docx 开始"></ul>
</dialog>

<!-- 抽屉：模板库 + 内置规则集 -->
<dialog id="drawer-templates" class="drawer">
  <div class="drawer-head">
    <h3>模板库</h3>
    <button class="btn pill small ghost" data-close>关闭</button>
  </div>
  <button id="btn-upload-template" class="btn pill solid">上传模板</button>
  <ul id="template-list" class="item-list empty-hint" data-empty="还没有模板，上传单位范本即可沉淀为资产"></ul>
  <div class="drawer-subhead">内置规则集</div>
  <div class="builtin-ruleset-row">
    <select id="builtin-ruleset-select" title="内置规则集"></select>
    <button id="btn-apply-ruleset" class="btn pill small">一键重排</button>
  </div>
</dialog>

<!-- 抽屉：版本时间线 -->
<dialog id="drawer-versions" class="drawer">
  <div class="drawer-head">
    <h3>版本时间线</h3>
    <button class="btn pill small ghost" data-close>关闭</button>
  </div>
  <ul id="version-list" class="item-list empty-hint" data-empty="每次修改自动存版本，可随时回滚"></ul>
</dialog>

<!-- 模板详情 / 实例化对话框 -->
<dialog id="template-dialog" class="modal">
  <h3 id="template-dialog-title">模板</h3>
  <div id="template-dialog-body"></div>
  <div class="modal-actions">
    <button class="btn pill ghost" data-close>关闭</button>
    <button class="btn pill solid" id="btn-instantiate">实例化为新文档</button>
  </div>
</dialog>

<!-- 模型设置对话框 -->
<dialog id="settings-dialog" class="modal">
  <h3>模型设置</h3>
  <div class="form-grid">
    <label>Provider
      <select id="cfg-provider">
        <option value="anthropic">Anthropic</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gateway">OpenAI 兼容网关（Ollama / vLLM / One-API…）</option>
      </select>
    </label>
    <label>模型 ID <input id="cfg-model" type="text" placeholder="deepseek-v4-flash / deepseek-v4-pro / claude-sonnet-4-5…"></label>
    <label>Base URL（网关时必填）<input id="cfg-baseurl" type="text" placeholder="http://localhost:11434/v1"></label>
    <label>API Key <input id="cfg-apikey" type="password" placeholder="留空则用环境变量"></label>
  </div>
  <div class="modal-actions">
    <button class="btn pill ghost" data-close>取消</button>
    <button class="btn pill solid" id="btn-save-config">保存（重载 agent 生效）</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
