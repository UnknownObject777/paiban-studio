<!DOCTYPE html>
<!-- preview.html — 预览 iframe：OnlyOffice 静态 SDK 只读渲染（D4）。
     wrapper 源码 vendored 于 src/onlyoffice-comp/，编译产物在 dist/src/。
     父页面 postMessage({type:'render', buffer}) 传入 ArrayBuffer，防抖在父页面做。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #fff; height: 100%; }
  .onlyoffice-container { position: absolute; inset: 0; }
  #status {
    position: absolute; z-index: 1; left: 0; right: 0;
    font: 12px sans-serif; color: rgba(0,0,0,.5); padding: 16px; text-align: center;
  }
</style>
</head>
<body>
<div id="status">等待文档…</div>
<div class="onlyoffice-container" data-onlyoffice-container-id="iframe-office-id">
  <div id="iframe-office-id"></div>
</div>
<script type="module" src="../dist/src/preview-frame.js"></script>
</body>
</html>
